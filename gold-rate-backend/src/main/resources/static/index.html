<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gold & Silver Price</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #2c2c2c;
            color: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .card h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #f1c40f;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }

        .info {
            font-size: 14px;
            margin-top: 8px;
            color: #ccc;
        }

        .error {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Live Gold & Silver Price</h1>

    <div id="goldPrice" class="price">Loading gold...</div>
    <div id="silverPrice" class="price">Loading silver...</div>

    <div id="xauUsd" class="info"></div>
    <div id="xagUsd" class="info"></div>
    <div id="usdInr" class="info"></div>

    <div id="lastUpdated" class="info"></div>
</div>

<script>
async function loadPrices() {
    try {
        const response = await fetch('/api/gold/price/details');

        if (!response.ok) {
            throw new Error("API error");
        }

        const data = await response.json();

        // GOLD
        document.getElementById("goldPrice").innerText =
            "24K Gold: ₹ " + data.goldPricePerGramInr.toFixed(2) + " / gram";

        // SILVER
        document.getElementById("silverPrice").innerText =
            "Silver: ₹ " + data.silverPricePerGramInr.toFixed(2) + " / gram";

        // Market values
        document.getElementById("xauUsd").innerText =
            "XAU / USD: " + data.xauUsd.toFixed(2);

        document.getElementById("xagUsd").innerText =
            "XAG / USD: " + data.xagUsd.toFixed(2);

        document.getElementById("usdInr").innerText =
            "USD / INR: " + data.usdInr.toFixed(2);

        document.getElementById("lastUpdated").innerText =
            "Last updated: " + new Date().toLocaleTimeString();

    } catch (error) {
        console.error(error);

        document.getElementById("goldPrice").innerText = "Error loading data";
        document.getElementById("goldPrice").classList.add("error");

        document.getElementById("silverPrice").innerText = "";
    }
}

// Load initially
loadPrices();

// Auto refresh every 60 seconds
setInterval(loadPrices, 60000);
</script>

</body>
</html>
