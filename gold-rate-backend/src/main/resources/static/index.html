<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold & Silver Rate</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom right, #dfe9f3, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 90%;
        max-width: 400px;
    }

    .card {
        background: #4a5568;
        color: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        text-align: center;
    }

    .title {
        font-size: 18px;
        opacity: 0.8;
        margin-bottom: 10px;
    }

    .price {
        font-size: 36px;
        font-weight: bold;
        color: #f6c343;
        margin-bottom: 10px;
    }

    .sub {
        font-size: 14px;
        opacity: 0.8;
        margin-top: 4px;
    }

    .updated {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<div class="container">

    <!-- GOLD CARD -->
    <div class="card">
        <div class="title">24K Gold Price (₹ / gram)</div>
        <div id="goldPrice" class="price">Loading...</div>
        <div id="xauUsd" class="sub"></div>
        <div id="usdInrGold" class="sub"></div>
        <div id="goldUpdated" class="updated"></div>
    </div>

    <!-- SILVER CARD -->
    <div class="card">
        <div class="title">Silver Price (₹ / gram)</div>
        <div id="silverPrice" class="price">Loading...</div>
        <div id="xagUsd" class="sub"></div>
        <div id="usdInrSilver" class="sub"></div>
        <div id="silverUpdated" class="updated"></div>
    </div>

</div>

<script>
async function loadPrices() {
    try {
        const response = await fetch("/api/gold/price/details");
        const data = await response.json();

        // GOLD
        document.getElementById("goldPrice").innerText =
            "₹ " + data.goldPricePerGramInr.toFixed(2);

        document.getElementById("xauUsd").innerText =
            "XAU / USD: " + data.xauUsd.toFixed(2);

        document.getElementById("usdInrGold").innerText =
            "USD / INR: " + data.usdInr.toFixed(2);

        document.getElementById("goldUpdated").innerText =
            "Last updated: " + new Date().toLocaleTimeString();

        // SILVER
        document.getElementById("silverPrice").innerText =
            "₹ " + data.silverPricePerGramInr.toFixed(2);

        document.getElementById("xagUsd").innerText =
            "XAG / USD: " + data.xagUsd.toFixed(2);

        document.getElementById("usdInrSilver").innerText =
            "USD / INR: " + data.usdInr.toFixed(2);

        document.getElementById("silverUpdated").innerText =
            "Last updated: " + new Date().toLocaleTimeString();

    } catch (error) {
        console.error("Error loading prices:", error);
    }
}

// Load immediately
loadPrices();

// Refresh every 60 seconds
setInterval(loadPrices, 60000);
</script>

</body>
</html>
